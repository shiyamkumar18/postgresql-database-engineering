name: PostgreSQL CI

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: subly
          POSTGRES_PASSWORD: subly
          POSTGRES_DB: subly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subly -d subly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://subly:subly@localhost:5432/subly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Initialize schema
        run: |
          for file in init/*.sql; do
            PGPASSWORD=subly psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Generate reproducible sample data
        run: python scripts/generate_mock_data.py --users 200 --events-per-user 10 --seed 42
      - name: Run tests
        run: pytest -v --cov=tests --cov-report=term-missing
